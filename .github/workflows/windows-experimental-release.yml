name: Experimental Windows release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit containing the Windows port"
        required: true
        default: "stable"
        type: string
      release_tag:
        description: "Experimental release tag to create or update"
        required: true
        default: "v1.2.1-windows-experimental"
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out Windows-port source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-windows.txt

      - name: Build executable
        shell: pwsh
        run: .\tools\build-windows.ps1

      - name: Rename experimental asset
        shell: pwsh
        run: Copy-Item .\dist\LibreCap\LibreCap.exe .\dist\LibreCap-Windows-Experimental.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreCap-Windows-Experimental
          path: .\dist\LibreCap-Windows-Experimental.exe

      - name: Create or update experimental prerelease
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          ASSET_PATH: ${{ github.workspace }}\dist\LibreCap-Windows-Experimental.exe
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const title = 'LibreCap 1.2.1 Windows (Experimental)';
            const body = [
              'Experimental Windows desktop build of LibreCap.',
              '',
              `Built from \`${process.env.SOURCE_REF}\` by the Windows release workflow.`,
              'This build is separate from the stable v1.2.1 release and requires the Microsoft Edge WebView2 Runtime.',
              '',
              'The executable is unsigned and intended for testing only.'
            ].join('\n');

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.data.id,
                name: title,
                body,
                prerelease: true,
                draft: false
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: process.env.SOURCE_REF,
                name: title,
                body,
                prerelease: true,
                draft: false
              });
            }

            const assetName = path.basename(process.env.ASSET_PATH);
            const existing = release.data.assets.find((asset) => asset.name === assetName);
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: existing.id
              });
            }

            const data = fs.readFileSync(process.env.ASSET_PATH);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name: assetName,
              label: 'Windows executable (experimental)',
              data,
              headers: {
                'content-type': 'application/vnd.microsoft.portable-executable',
                'content-length': data.length
              }
            });

            core.info(`Published ${assetName} to ${tag}`);
